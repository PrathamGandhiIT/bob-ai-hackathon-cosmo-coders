submission:
  title: "SupplyGuard AI — Autonomous Supply Chain Control Tower & Fleet Optimizer" # REQUIRED

  problem_statement: >
    Global supply chains suffer multi-billion dollar losses annually from unpredicted disruptions,
    opaque rerouting decisions, fleet underutilization, and cold-chain temperature excursions.
    Logistics managers lack an integrated intelligent control tower that can quantify multi-objective
    trade-offs across cost, delay, risk, and CO2 emissions in real time.

  solution_summary: >
    SupplyGuard AI is an autonomous, AI-driven supply chain resilience engine and control tower.
    It correlates active geopolitical, port, and weather disruptions with in-transit shipments,
    evaluates multi-carrier rerouting alternatives using Pareto-optimal trade-offs, optimizes
    fleet vehicle allocations, monitors pharmaceutical/perishable cold-chain integrity via IoT telemetry,
    and provides an interactive AI Copilot powered by watsonx.ai / IBM Bob.

  key_features:
    - "Real-Time Disruption Impact Matrix: Correlates global disruptions (port strikes, canal closures, weather) against active multimodal shipments."
    - "Multi-Objective Rerouting Engine: Evaluates air/ocean/rail alternatives with Pareto-optimal trade-off scoring across Cost, Delay, Risk, and CO2."
    - "Dynamic Fleet Utilization Optimizer: Identifies idle and low-utilization vehicles, calculating redeployment capacity and CO2 savings."
    - "Cold Chain IoT Compliance Guard: Real-time telemetry monitoring with automated excursion detection and spoilage risk alerts for sensitive cargo."
    - "Context-Aware AI Copilot: Interactive conversational assistant powered by watsonx.ai with structured operational action recommendations."

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "Uvicorn", "Pydantic"]
    ibm_technologies: ["watsonx.ai", "IBM Bob AI Assistant"]
    databases: ["SQLite", "Pandas DataFrames"]
    other: ["Recharts", "Lucide React", "Axios"]

  what_we_are_most_proud_of: >
    The Multi-Objective Rerouting Optimization Engine that doesn't just suggest single-path fixes,
    but provides complete mathematical trade-off transparency (Cost vs ETA Delay vs Risk Index vs CO2 Emissions)
    with human-in-the-loop decision capability and an AI Copilot that automatically synthesizes actionable recovery playbooks.

  known_limitations: >
    Currently uses an embedded SQLite database and realistic synthetic historical datasets for local hackathon evaluation.
    Production scaling would connect directly into live AIS marine satellite streams, ERP connectors (SAP/Oracle),
    and enterprise Kafka streaming pipelines.

